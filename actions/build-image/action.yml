name: 'Armbian/build'
author: 'Stefan Dej'
description: 'Build armbian images'
inputs:
  configfile:
    description: 'Config file name'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Free GitHub Runner
      if: runner.arch != 'ARM64'
      uses: descriptinc/free-disk-space@main
      with:
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Read configs
      id: config
      shell: bash
      run: |
        source ./build-configs/configs/config-default.conf
        source ./build-configs/configs/board-${{ inputs.configfile }}.conf
        
        echo "armbian_repository=${ARMBIAN_REPOSITORY}" >> $GITHUB_OUTPUT
        echo "armbian_branch=${ARMBIAN_BRANCH}" >> $GITHUB_OUTPUT

    - name: Checkout armbian Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 1
        repository: ${{ steps.config.outputs.armbian_repository }}
        ref: ${{ steps.config.outputs.armbian_branch }}
        path: build

    - name: Patch kernel Makefile URL
      shell: bash
      run: |
        # git.kernel.org is often unreachable from GitHub runners. Git access is redirected via
        # 'insteadOf' in config-default.conf, but Armbian fetches the kernel Makefile via curl from
        # git.kernel.org/.../plain/Makefile. Use the GitHub stable mirror (gregkh/linux) instead.
        file=./build/lib/functions/general/git-ref2info.sh
        perl -0pi -e 's{^(\t+)("https://git\.kernel\.org/pub/scm/linux/kernel/"\* \| "https://git\.ti\.com/"\*\))}{$1"https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git")\n$1\turl="https://raw.githubusercontent.com/gregkh/linux/\$\{sha1\}/Makefile"\n$1\t;;\n\n$1$2}m' "${file}"
        if grep -q 'gregkh/linux' "${file}"; then
          grep -n -B1 -A3 'gregkh/linux' "${file}"
        else
          echo "::warning::Could not patch kernel Makefile URL in ${file}, anchor not found"
        fi

    - name: Create config-default.conf
      shell: bash
      run: |
        mkdir -p ./build/userpatches
        cp ./build-configs/configs/config-default.conf ./build/userpatches/config-settings.conf
        cat ./build-configs/configs/board-${{ inputs.configfile }}.conf >> ./build/userpatches/config-settings.conf
        echo "::group::Output config-settings.conf"
        cat ./build/userpatches/config-settings.conf
        echo "::endgroup::"

    - name: sed VERSION
      shell: bash
      run: |
        sed -i 's/-trunk//' ./build/VERSION
        echo "::group::Output VERSION"
        cat ./build/VERSION
        echo "::endgroup::"

    - name: Build Image
      shell: bash
      run: |
        cd ./build
        ./compile.sh settings

    - name: Fix userrights
      shell: bash
      run: |
        WORKSPACE=$(echo ${{ github.workspace }})
        sudo chown -R $USER:$USER $WORKSPACE/build || true
        sudo chmod 0777 -R $WORKSPACE/build || true
        sudo df
